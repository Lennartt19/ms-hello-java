name: ci

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v7

      - name: Obtener un SHA corto
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Construyendo la imagen Docker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hello-service:${{ steps.vars.outputs.sha_short }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v7
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hello-service:latest